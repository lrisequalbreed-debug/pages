      color: #0d6efd

      color: #6c757d;

    }

      top: -.2rem;
      background-color: transparent;
      z-index: 1

    .form-control {

      border-right: none;

    .form-control:focus {

      outline: 0;
      border-bottom-color: #0d6efd
    }

    .input-icon {
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem
    }

    .btn-primary {
      width: 100%;
      padding: .75rem;
      font-size: 1rem;
      background-color: #0d6efd;
      border: none;
      border-radius: .375rem;
      transition: background-color .3s, color .3s
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
      color: #fff
    }

    .btn-primary:focus {
      box-shadow: none
    }

    @media (max-width:576px) {
      .form-container {
        padding: 1.5rem
      }
    }

    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .5);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      display: none
    }

    .error-message {
      color: red;
      margin-bottom: 1rem;
      display: none
    }
  </style>



</head>

<!-- JavaScript Code -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const botCheck = document.getElementById('bot-check');
    const verificationDiv = document.getElementById('verification-div');
    const formContainer = document.getElementById('form-container');

    const mainContent = document.getElementById('main-content');

    botCheck.addEventListener('change', function () {
      if (this.checked) {
        // Replace the checkbox with a loader
        const checkboxContainer = this.parentElement;
        checkboxContainer.innerHTML = `
            <div class="spinner-container d-flex align-items-center">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <span class="ms-2">Verifying...</span>
            </div>
          `;

        // Wait for 4 seconds
        setTimeout(function () {
          // Display "Redirecting..." message
          verificationDiv.innerHTML = `
              <div class="row">
                <div class="col-12 verification-content">
                  <h2>Redirecting...</h2>
                </div>
              </div>
            `;

          // Wait for 2 seconds
          setTimeout(function () {
            // Hide verification div and show main content
            verificationDiv.style.display = 'none';
            mainContent.style.display = 'block';
            formContainer.style.display = 'block';
          }, 2000);
        }, 4000);
      }
    });
  });
</script>
